<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; script-src 'self' 'unsafe-inline';"
    />
    <title>VoxVer Splash</title>
    <style>
      /* ------------------------------------------------------------------
         启动画面：晴空背景下草方块落地 → 品牌浮现 → 像素进度条推进
         由 electron/splash.ts 在独立无边框窗口里加载；主窗口 ready 后
         调用 window.__voxSplashExit() 播放退场，再销毁窗口。

         配色取向：白天的 Minecraft 草原 —— 浅蓝天空、奶油色地面、
         草绿与泥土棕；不用深色科技底、不用紫蓝色调。
         ------------------------------------------------------------------ */
      @font-face {
        font-family: 'Press Start 2P';
        font-style: normal;
        font-weight: 400;
        font-display: block;
        src: url('./fonts/PressStart2P-Regular.woff2') format('woff2');
      }

      :root {
        --sky-hi: #cfe9fb;
        --sky-mid: #eaf7ff;
        --sky-lo: #fdf9ee;
        --ground-hi: #e9f7cc;
        --ground-lo: #d5edb0;
        --ink: #2f4a37;
        --muted: #70856c;
        --grass: #63bd43;
        --grass-hi: #9ada6d;
        --dirt: #a9793f;
        --card-line: rgba(112, 140, 104, 0.26);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: transparent;
        font-family: 'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif;
        user-select: none;
        -webkit-user-select: none;
        cursor: default;
      }

      .splash {
        position: relative;
        width: 440px;
        height: 272px;
        overflow: hidden;
        border: 1px solid var(--card-line);
        border-radius: 14px;
        /* 天空 → 地面的竖直渐变，右上角留一团暖阳光 */
        background:
          radial-gradient(46% 34% at 78% 8%, rgba(255, 232, 168, 0.75) 0%, rgba(255, 240, 200, 0) 72%),
          linear-gradient(180deg, var(--sky-hi) 0%, var(--sky-mid) 48%, var(--sky-lo) 100%);
        box-shadow:
          0 18px 44px rgba(56, 76, 46, 0.22),
          inset 0 1px 0 rgba(255, 255, 255, 0.9);
        animation: card-in 0.34s cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }

      /* ---------- 背景：地面带（地平线） ---------- */
      .ground {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 38px;
        background: linear-gradient(180deg, var(--ground-hi) 0%, var(--ground-lo) 100%);
        border-top: 1px solid rgba(126, 168, 92, 0.45);
      }

      /* 交界处的像素草叶 */
      .ground::before {
        content: '';
        position: absolute;
        left: 0;
        right: 0;
        top: -5px;
        height: 5px;
        background-image: repeating-linear-gradient(
          90deg,
          rgba(112, 178, 72, 0.85) 0,
          rgba(112, 178, 72, 0.85) 4px,
          transparent 4px,
          transparent 9px
        );
        -webkit-mask-image: linear-gradient(90deg, transparent, #000 12%, #000 88%, transparent);
        mask-image: linear-gradient(90deg, transparent, #000 12%, #000 88%, transparent);
      }

      /* ---------- 背景：像素云 ---------- */
      .cloud {
        position: absolute;
        width: 44px;
        height: 11px;
        background: rgba(255, 255, 255, 0.92);
        box-shadow:
          11px -10px 0 rgba(255, 255, 255, 0.92),
          27px -10px 0 rgba(255, 255, 255, 0.92),
          38px 0 0 rgba(255, 255, 255, 0.92);
        opacity: 0;
        animation:
          cloud-in 0.6s ease-out both,
          cloud-drift 9s linear infinite;
      }

      .cloud-a {
        left: 26px;
        top: 42px;
        animation-delay: 0.1s, 0s;
      }

      .cloud-b {
        left: 330px;
        top: 46px;
        transform: scale(0.62);
        animation-delay: 0.24s, 1.6s;
        opacity: 0.7;
      }

      /* ---------- 品牌组合：图标 + 文字同一行，垂直居中 ---------- */
      .lockup {
        position: absolute;
        left: 0;
        right: 0;
        top: 74px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 14px;
        pointer-events: none;
      }

      /* 图标槽位：落地动画的舞台 */
      .mark {
        position: relative;
        width: 56px;
        height: 56px;
        flex: 0 0 auto;
      }

      .block-wrap {
        position: absolute;
        inset: 0;
        animation: block-drop 0.68s cubic-bezier(0.45, 0, 0.9, 0.5) both;
      }

      .block {
        width: 56px;
        height: 56px;
        display: block;
        filter: drop-shadow(0 7px 10px rgba(48, 96, 156, 0.3));
        animation: block-squash 0.42s cubic-bezier(0.3, 1.6, 0.5, 1) 0.68s both;
      }

      /* 落地阴影 */
      .block-shadow {
        position: absolute;
        left: 50%;
        bottom: -5px;
        width: 54px;
        height: 9px;
        margin-left: -27px;
        border-radius: 50%;
        background: radial-gradient(ellipse, rgba(74, 92, 48, 0.28) 0%, rgba(74, 92, 48, 0) 72%);
        opacity: 0;
        animation: shadow-in 0.68s cubic-bezier(0.45, 0, 0.9, 0.5) both;
      }

      /* 落地时的一圈浅色扬尘 */
      .ring {
        position: absolute;
        left: 50%;
        bottom: -8px;
        width: 20px;
        height: 20px;
        margin-left: -10px;
        border: 2px solid rgba(122, 180, 236, 0.6);
        border-radius: 50%;
        opacity: 0;
        animation: ring-out 0.62s cubic-bezier(0.2, 0.6, 0.3, 1) 0.66s forwards;
      }

      /* 像素尘埃（被溅起的浅蓝碎光） */
      .dust {
        position: absolute;
        left: 50%;
        bottom: 0;
        width: 4px;
        height: 4px;
        background: rgba(160, 208, 248, 0.95);
        opacity: 0;
        animation: dust-fly 0.52s ease-out 0.66s forwards;
      }

      /* ---------- 品牌文字（与图标同排，垂直居中） ---------- */
      .wordmark {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 7px;
      }

      .brand-name {
        font-family: 'Press Start 2P', 'Segoe UI', monospace;
        font-size: 16px;
        line-height: 1;
        letter-spacing: 0.14em;
        color: var(--ink);
        text-shadow: 0 2px 0 rgba(255, 255, 255, 0.85);
        opacity: 0;
        animation: fade-up 0.42s ease-out 0.84s both;
      }

      .brand-sub {
        font-family: 'Press Start 2P', monospace;
        font-size: 7px;
        line-height: 1;
        letter-spacing: 0.42em;
        color: var(--muted);
        text-align: left;
        opacity: 0;
        animation: fade-up 0.42s ease-out 0.94s both;
      }

      /* ---------- 进度条 ---------- */
      .bar-wrap {
        position: absolute;
        left: 50%;
        top: 152px;
        width: 244px;
        margin-left: -122px;
        opacity: 0;
        animation: fade-up 0.4s ease-out 0.98s both;
      }

      .bar {
        position: relative;
        height: 10px;
        padding: 2px;
        border: 1px solid rgba(112, 140, 104, 0.35);
        border-radius: 3px;
        background: rgba(255, 255, 255, 0.72);
        box-shadow: inset 0 1px 2px rgba(90, 110, 80, 0.16);
        overflow: hidden;
      }

      .bar-fill {
        position: relative;
        width: 0;
        height: 100%;
        border-radius: 1px;
        background: linear-gradient(90deg, #4f9e33 0%, var(--grass) 55%, var(--grass-hi) 100%);
        animation: bar-fill 1.55s cubic-bezier(0.25, 0.7, 0.25, 1) 1.02s both;
      }

      /* 进度条上的高光扫过 */
      .bar-fill::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(100deg, transparent 20%, rgba(255, 255, 255, 0.6) 50%, transparent 80%);
        transform: translateX(-100%);
        animation: bar-shine 1.15s ease-in-out 1.15s infinite;
      }

      /* 像素刻度 */
      .bar-ticks {
        position: absolute;
        inset: 2px;
        background-image: repeating-linear-gradient(
          90deg,
          transparent 0,
          transparent 23px,
          rgba(78, 104, 62, 0.42) 23px,
          rgba(78, 104, 62, 0.42) 25px
        );
        pointer-events: none;
      }

      /* ---------- 状态文字 / 版本 ---------- */
      .status {
        position: absolute;
        left: 0;
        right: 0;
        top: 178px;
        text-align: center;
        font-size: 11px;
        letter-spacing: 0.06em;
        color: var(--muted);
        opacity: 0;
        animation: fade-up 0.4s ease-out 1.06s both;
        transition: opacity 0.18s ease;
      }

      .status.swapping {
        opacity: 0.35;
      }

      .version {
        position: absolute;
        right: 16px;
        bottom: 10px;
        text-align: right;
        font-size: 10px;
        letter-spacing: 0.14em;
        color: #5c7a4f;
        opacity: 0;
        animation: fade-up 0.4s ease-out 1.14s both;
      }

      /* ---------- 动画 ---------- */
      @keyframes card-in {
        from {
          opacity: 0;
          transform: scale(0.97);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }

      @keyframes cloud-in {
        from {
          opacity: 0;
        }
        to {
          opacity: 0.9;
        }
      }

      @keyframes cloud-drift {
        from {
          margin-left: 0;
        }
        to {
          margin-left: 16px;
        }
      }

      @keyframes block-drop {
        0% {
          transform: translateY(-58px);
          opacity: 0;
        }
        14% {
          opacity: 1;
        }
        72% {
          transform: translateY(0);
        }
        86% {
          transform: translateY(-7px);
        }
        100% {
          transform: translateY(0);
          opacity: 1;
        }
      }

      @keyframes block-squash {
        0%,
        100% {
          transform: scale(1, 1);
        }
        35% {
          transform: scale(1.12, 0.86);
        }
        70% {
          transform: scale(0.96, 1.05);
        }
      }

      @keyframes shadow-in {
        0%,
        60% {
          opacity: 0;
          transform: scale(0.4);
        }
        80% {
          opacity: 1;
          transform: scale(1.05);
        }
        100% {
          opacity: 0.85;
          transform: scale(1);
        }
      }

      @keyframes ring-out {
        0% {
          opacity: 0.9;
          transform: scale(0.4);
        }
        100% {
          opacity: 0;
          transform: scale(3.4);
        }
      }

      @keyframes dust-fly {
        0% {
          opacity: 1;
          transform: translate(var(--dx0, 0), 0) scale(1);
        }
        100% {
          opacity: 0;
          transform: translate(var(--dx1, 0), var(--dy1, -14px)) scale(0.4);
        }
      }

      @keyframes fade-up {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes bar-fill {
        from {
          width: 0;
        }
        to {
          width: 100%;
        }
      }

      @keyframes bar-shine {
        0% {
          transform: translateX(-100%);
        }
        60%,
        100% {
          transform: translateX(140%);
        }
      }

      /* 系统要求减少动态效果时：静态展示 */
      @media (prefers-reduced-motion: reduce) {
        .splash,
        .cloud,
        .block-wrap,
        .block,
        .block-shadow,
        .ring,
        .dust,
        .brand-name,
        .brand-sub,
        .bar-wrap,
        .bar-fill,
        .status,
        .version {
          animation-duration: 0.01ms !important;
          animation-delay: 0ms !important;
          opacity: 1 !important;
        }

        .bar-fill {
          width: 100% !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="splash" id="splash">
      <div class="cloud cloud-a"></div>
      <div class="cloud cloud-b"></div>
      <div class="ground"></div>

      <div class="lockup">
        <div class="mark">
          <div class="block-shadow"></div>
          <div class="block-wrap">
            <img class="block" src="./brand/mark-256.png" alt="" draggable="false" />
          </div>
          <div class="ring"></div>
        </div>
        <div class="wordmark">
          <div class="brand-name">VOXVER</div>
          <div class="brand-sub">LAUNCHER</div>
        </div>
      </div>

      <div class="bar-wrap">
        <div class="bar">
          <div class="bar-fill" id="barFill"></div>
          <div class="bar-ticks"></div>
        </div>
      </div>

      <div class="status" id="status">正在启动…</div>
      <div class="version" id="version"></div>
    </div>

    <script>
      (function () {
        var splash = document.getElementById('splash')
        var statusEl = document.getElementById('status')
        var versionEl = document.getElementById('version')

        // 版本号由主进程通过 ?v=0.7.5 传入；取不到就留空，绝不显示占位符
        var version = new URLSearchParams(location.search).get('v')
        if (version) versionEl.textContent = 'v' + version.replace(/^v/i, '')

        // 落地尘埃：8 颗像素碎光以不同角度散开
        var stage = document.querySelector('.mark')
        for (var i = 0; i < 8; i++) {
          var dust = document.createElement('div')
          dust.className = 'dust'
          var dir = i % 2 === 0 ? 1 : -1
          dust.style.setProperty('--dx0', dir * (2 + i) + 'px')
          dust.style.setProperty('--dx1', dir * (14 + i * 4) + 'px')
          dust.style.setProperty('--dy1', -(10 + i * 3) + 'px')
          dust.style.animationDelay = 0.66 + (i % 4) * 0.02 + 's'
          stage.appendChild(dust)
        }

        // 进度条推完后，状态文字依次切换
        var lines = ['正在准备渲染进程…', '正在加载本地资源…', '即将就绪…']
        var lineIndex = 0
        var statusTimer = setInterval(function () {
          if (lineIndex >= lines.length) {
            clearInterval(statusTimer)
            return
          }
          statusEl.classList.add('swapping')
          setTimeout(function () {
            statusEl.textContent = lines[lineIndex++]
            statusEl.classList.remove('swapping')
          }, 160)
        }, 620)

        // 主进程在窗口就绪时调用：播放退场动画（240ms），随后由主进程销毁窗口
        window.__voxSplashExit = function () {
          clearInterval(statusTimer)
          if (!splash || !splash.animate) return
          splash.animate(
            [
              { opacity: 1, transform: 'scale(1)' },
              { opacity: 0, transform: 'scale(0.965)' }
            ],
            { duration: 240, easing: 'cubic-bezier(0.4, 0, 1, 1)', fill: 'forwards' }
          )
        }

        // 调试用：?at=<毫秒> 把所有动画冻结在该时刻，方便逐帧截图核对
        // （只在带参数时生效，不影响正常启动流程）
        var freezeAt = Number(new URLSearchParams(location.search).get('at'))
        if (Number.isFinite(freezeAt) && freezeAt > 0) {
          requestAnimationFrame(function () {
            requestAnimationFrame(function () {
              document.getAnimations().forEach(function (animation) {
                animation.pause()
                animation.currentTime = freezeAt
              })
            })
          })
        }
      })()
    </script>
  </body>
</html>
