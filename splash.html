<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; script-src 'self' 'unsafe-inline';"
    />
    <title>VoxVer Splash</title>
    <style>
      /* ------------------------------------------------------------------
         启动画面：草方块落地 → 品牌浮现 → 像素进度条推进
         由 electron/splash.ts 在独立无边框窗口里加载；主窗口 ready 后
         调用 window.__voxSplashExit() 播放退场，再销毁窗口。
         ------------------------------------------------------------------ */
      @font-face {
        font-family: 'Press Start 2P';
        font-style: normal;
        font-weight: 400;
        font-display: block;
        src: url('./fonts/PressStart2P-Regular.woff2') format('woff2');
      }

      :root {
        --bg-hi: #1a2136;
        --bg-mid: #0e1220;
        --bg-lo: #0a0d16;
        --line: rgba(255, 255, 255, 0.09);
        --primary: #5b8cff;
        --text: #e8ecf8;
        --muted: #8a93ab;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: transparent;
        font-family: 'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif;
        user-select: none;
        -webkit-user-select: none;
        cursor: default;
      }

      .splash {
        position: relative;
        width: 440px;
        height: 272px;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: radial-gradient(120% 95% at 50% 0%, var(--bg-hi) 0%, var(--bg-mid) 56%, var(--bg-lo) 100%);
        box-shadow:
          0 26px 64px rgba(0, 0, 0, 0.55),
          inset 0 1px 0 rgba(255, 255, 255, 0.06);
        animation: card-in 0.34s cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }

      /* 背景像素网格 */
      .grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.045) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.045) 1px, transparent 1px);
        background-size: 16px 16px;
        -webkit-mask-image: radial-gradient(78% 62% at 50% 34%, #000 26%, transparent 100%);
        mask-image: radial-gradient(78% 62% at 50% 34%, #000 26%, transparent 100%);
        pointer-events: none;
      }

      /* 中心辉光 */
      .glow {
        position: absolute;
        left: 50%;
        top: 74px;
        width: 260px;
        height: 150px;
        margin-left: -130px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(91, 140, 255, 0.16) 0%, transparent 68%);
        animation: glow-breathe 3.2s ease-in-out infinite;
        pointer-events: none;
      }

      /* ---------- 舞台：草方块落地 ---------- */
      .stage {
        position: absolute;
        left: 50%;
        top: 22px;
        width: 120px;
        height: 64px;
        margin-left: -60px;
      }

      .block-wrap {
        position: absolute;
        left: 50%;
        top: 0;
        width: 52px;
        height: 52px;
        margin-left: -26px;
        animation: block-drop 0.68s cubic-bezier(0.45, 0, 0.9, 0.5) both;
      }

      .block {
        width: 52px;
        height: 52px;
        display: block;
        image-rendering: pixelated;
        filter: drop-shadow(0 10px 16px rgba(0, 0, 0, 0.5));
        animation: block-squash 0.42s cubic-bezier(0.3, 1.6, 0.5, 1) 0.68s both;
      }

      /* 落地阴影 */
      .block-shadow {
        position: absolute;
        left: 50%;
        top: 47px;
        width: 54px;
        height: 9px;
        margin-left: -27px;
        border-radius: 50%;
        background: radial-gradient(ellipse, rgba(91, 140, 255, 0.4) 0%, transparent 70%);
        opacity: 0;
        animation: shadow-in 0.68s cubic-bezier(0.45, 0, 0.9, 0.5) both;
      }

      /* 落点光圈 */
      .ring {
        position: absolute;
        left: 50%;
        top: 41px;
        width: 18px;
        height: 18px;
        margin-left: -9px;
        border: 2px solid rgba(91, 140, 255, 0.55);
        border-radius: 50%;
        opacity: 0;
        animation: ring-out 0.62s cubic-bezier(0.2, 0.6, 0.3, 1) 0.66s forwards;
      }

      /* 像素尘埃 */
      .dust {
        position: absolute;
        left: 50%;
        top: 50px;
        width: 4px;
        height: 4px;
        background: #6d9bff;
        opacity: 0;
        animation: dust-fly 0.52s ease-out 0.66s forwards;
      }

      /* ---------- 品牌 ---------- */
      .brand {
        position: absolute;
        left: 0;
        right: 0;
        top: 116px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .brand-name {
        font-family: 'Press Start 2P', 'Segoe UI', monospace;
        font-size: 15px;
        line-height: 1;
        letter-spacing: 0.16em;
        color: var(--text);
        text-shadow: 0 0 14px rgba(91, 140, 255, 0.5);
        opacity: 0;
        animation: fade-up 0.42s ease-out 0.84s both;
      }

      .brand-sub {
        position: absolute;
        left: 0;
        right: 0;
        top: 148px;
        text-align: center;
        font-family: 'Press Start 2P', monospace;
        font-size: 7px;
        letter-spacing: 0.42em;
        color: var(--muted);
        opacity: 0;
        animation: fade-up 0.42s ease-out 0.94s both;
      }

      /* ---------- 进度条 ---------- */
      .bar-wrap {
        position: absolute;
        left: 50%;
        top: 178px;
        width: 244px;
        margin-left: -122px;
        opacity: 0;
        animation: fade-up 0.4s ease-out 0.98s both;
      }

      .bar {
        position: relative;
        height: 10px;
        padding: 2px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 3px;
        background: rgba(255, 255, 255, 0.04);
        overflow: hidden;
      }

      .bar-fill {
        position: relative;
        width: 0;
        height: 100%;
        border-radius: 1px;
        background: linear-gradient(90deg, #3f6fe0 0%, var(--primary) 60%, #8fb4ff 100%);
        box-shadow: 0 0 12px rgba(91, 140, 255, 0.55);
        animation: bar-fill 1.55s cubic-bezier(0.25, 0.7, 0.25, 1) 1.02s both;
      }

      /* 进度条上的高光扫过 */
      .bar-fill::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(100deg, transparent 20%, rgba(255, 255, 255, 0.55) 50%, transparent 80%);
        transform: translateX(-100%);
        animation: bar-shine 1.15s ease-in-out 1.15s infinite;
      }

      /* 像素刻度 */
      .bar-ticks {
        position: absolute;
        inset: 2px;
        background-image: repeating-linear-gradient(
          90deg,
          transparent 0,
          transparent 23px,
          rgba(10, 13, 22, 0.85) 23px,
          rgba(10, 13, 22, 0.85) 25px
        );
        pointer-events: none;
      }

      /* ---------- 状态文字 / 版本 ---------- */
      .status {
        position: absolute;
        left: 0;
        right: 0;
        top: 200px;
        text-align: center;
        font-size: 11px;
        letter-spacing: 0.06em;
        color: var(--muted);
        opacity: 0;
        animation: fade-up 0.4s ease-out 1.06s both;
        transition: opacity 0.18s ease;
      }

      .status.swapping {
        opacity: 0.35;
      }

      .version {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 12px;
        text-align: center;
        font-size: 10px;
        letter-spacing: 0.14em;
        color: rgba(138, 147, 171, 0.65);
        opacity: 0;
        animation: fade-up 0.4s ease-out 1.14s both;
      }

      /* ---------- 动画 ---------- */
      @keyframes card-in {
        from {
          opacity: 0;
          transform: scale(0.97);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }

      @keyframes glow-breathe {
        0%,
        100% {
          opacity: 0.75;
        }
        50% {
          opacity: 1;
        }
      }

      @keyframes block-drop {
        0% {
          transform: translateY(-118px);
          opacity: 0;
        }
        14% {
          opacity: 1;
        }
        72% {
          transform: translateY(0);
        }
        86% {
          transform: translateY(-7px);
        }
        100% {
          transform: translateY(0);
          opacity: 1;
        }
      }

      @keyframes block-squash {
        0%,
        100% {
          transform: scale(1, 1);
        }
        35% {
          transform: scale(1.12, 0.86);
        }
        70% {
          transform: scale(0.96, 1.05);
        }
      }

      @keyframes shadow-in {
        0%,
        60% {
          opacity: 0;
          transform: scale(0.4);
        }
        80% {
          opacity: 1;
          transform: scale(1.05);
        }
        100% {
          opacity: 0.85;
          transform: scale(1);
        }
      }

      @keyframes ring-out {
        0% {
          opacity: 0.9;
          transform: scale(0.4);
        }
        100% {
          opacity: 0;
          transform: scale(3.4);
        }
      }

      @keyframes dust-fly {
        0% {
          opacity: 1;
          transform: translate(var(--dx0, 0), 0) scale(1);
        }
        100% {
          opacity: 0;
          transform: translate(var(--dx1, 0), var(--dy1, -14px)) scale(0.4);
        }
      }

      @keyframes fade-up {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes bar-fill {
        from {
          width: 0;
        }
        to {
          width: 100%;
        }
      }

      @keyframes bar-shine {
        0% {
          transform: translateX(-100%);
        }
        60%,
        100% {
          transform: translateX(140%);
        }
      }

      /* 系统要求减少动态效果时：静态展示 */
      @media (prefers-reduced-motion: reduce) {
        .splash,
        .block-wrap,
        .block,
        .block-shadow,
        .ring,
        .dust,
        .brand-name,
        .brand-sub,
        .bar-wrap,
        .bar-fill,
        .status,
        .version {
          animation-duration: 0.01ms !important;
          animation-delay: 0ms !important;
          opacity: 1 !important;
        }

        .bar-fill {
          width: 100% !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="splash" id="splash">
      <div class="grid"></div>
      <div class="glow"></div>

      <div class="stage">
        <div class="block-shadow"></div>
        <div class="block-wrap">
          <img class="block" src="./minecraft-grass-block.png" alt="" draggable="false" />
        </div>
        <div class="ring"></div>
      </div>

      <div class="brand">
        <div class="brand-name">VOXVER</div>
      </div>
      <div class="brand-sub">LAUNCHER</div>

      <div class="bar-wrap">
        <div class="bar">
          <div class="bar-fill" id="barFill"></div>
          <div class="bar-ticks"></div>
        </div>
      </div>

      <div class="status" id="status">正在启动…</div>
      <div class="version" id="version"></div>
    </div>

    <script>
      (function () {
        var splash = document.getElementById('splash')
        var statusEl = document.getElementById('status')
        var versionEl = document.getElementById('version')

        // 版本号由主进程通过 ?v=0.7.5 传入；取不到就留空，绝不显示占位符
        var version = new URLSearchParams(location.search).get('v')
        if (version) versionEl.textContent = 'v' + version.replace(/^v/i, '')

        // 落地尘埃：8 颗像素以不同角度散开
        var stage = document.querySelector('.stage')
        for (var i = 0; i < 8; i++) {
          var dust = document.createElement('div')
          dust.className = 'dust'
          var dir = i % 2 === 0 ? 1 : -1
          dust.style.setProperty('--dx0', dir * (2 + i) + 'px')
          dust.style.setProperty('--dx1', dir * (14 + i * 4) + 'px')
          dust.style.setProperty('--dy1', -(10 + i * 3) + 'px')
          dust.style.animationDelay = 0.66 + (i % 4) * 0.02 + 's'
          stage.appendChild(dust)
        }

        // 进度条推完后，状态文字依次切换
        var lines = ['正在准备渲染进程…', '正在加载本地资源…', '即将就绪…']
        var lineIndex = 0
        var statusTimer = setInterval(function () {
          if (lineIndex >= lines.length) {
            clearInterval(statusTimer)
            return
          }
          statusEl.classList.add('swapping')
          setTimeout(function () {
            statusEl.textContent = lines[lineIndex++]
            statusEl.classList.remove('swapping')
          }, 160)
        }, 620)

        // 主进程在窗口就绪时调用：播放退场动画（240ms），随后由主进程销毁窗口
        window.__voxSplashExit = function () {
          clearInterval(statusTimer)
          if (!splash || !splash.animate) return
          splash.animate(
            [
              { opacity: 1, transform: 'scale(1)' },
              { opacity: 0, transform: 'scale(0.965)' }
            ],
            { duration: 240, easing: 'cubic-bezier(0.4, 0, 1, 1)', fill: 'forwards' }
          )
        }

        // 调试用：?at=<毫秒> 把所有动画冻结在该时刻，方便逐帧截图核对
        // （只在带参数时生效，不影响正常启动流程）
        var freezeAt = Number(new URLSearchParams(location.search).get('at'))
        if (Number.isFinite(freezeAt) && freezeAt > 0) {
          requestAnimationFrame(function () {
            requestAnimationFrame(function () {
              document.getAnimations().forEach(function (animation) {
                animation.pause()
                animation.currentTime = freezeAt
              })
            })
          })
        }
      })()
    </script>
  </body>
</html>
