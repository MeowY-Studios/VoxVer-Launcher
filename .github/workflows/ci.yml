name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '24'

jobs:
  lint:
    name: Lint
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  # 类型检查独立成 job：electron-vite build 走 esbuild 只转译不检查类型，
  # 没有它 TS 错误可以在 CI 全绿的情况下长期积累（v0.7.5 就积了 7 个）。
  # 不挂在 lint 后面：lint 一旦变红会连带把类型检查也跳过，两个门禁互相独立更稳。
  typecheck:
    name: Type Check
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript type check
        run: npm run typecheck

  build:
    name: Build
    runs-on: windows-latest
    needs: lint
    strategy:
      matrix:
        platform: [windows]
        node: ['24']
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      # runner 上下文只在 job / step 级可用：写进工作流级 env 会让整份工作流解析失败
      - name: Cache Electron downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/AppData/Local/electron/Cache
          key: electron-dl-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-dl-${{ runner.os }}-

      - name: Cache electron-builder
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron-builder
            ~/AppData/Local/electron-builder/Cache
          key: electron-builder-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-builder-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: out/
          retention-days: 7

  test:
    name: Unit Tests
    runs-on: windows-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Vitest
        run: npm install -D vitest @vue/test-utils jsdom

      - name: Run tests
        run: npx vitest run --reporter=verbose

  package:
    # macos-latest = macOS 26 (ARM64, Node 24, npm 11, OpenSSL 3.x) as of 2026-07
    # windows-latest = Windows Server 2025
    name: Package (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}-latest
    needs: [build, test, typecheck]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    strategy:
      matrix:
        platform: [windows, macos]
        include:
          - platform: windows
            build-script: build:win
            artifact-name: VoxVer-Launcher-Windows
            artifact-pattern: |
              build/VoxVer Launcher Setup *.exe
              build/*.blockmap
              build/latest.yml
          - platform: macos
            build-script: build:mac
            artifact-name: VoxVer-Launcher-macOS
            artifact-pattern: |
              build/*.dmg
              build/*.blockmap
              build/latest-mac.yml
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: out/

      - name: Install dependencies
        run: npm ci

      - name: Package application
        run: npx electron-builder --${{ matrix.platform }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-pattern }}

  release:
    name: Create Release
    runs-on: windows-latest
    needs: package
    if: startsWith(github.ref, 'refs/tags/')
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Build & Publish (Release)
    runs-on: windows-latest
    needs: release
    if: startsWith(github.ref, 'refs/tags/MCLAv')
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Full build and package
        run: npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            build/VoxVer Setup *.exe
            build/*.blockmap
            build/latest.yml
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
