name: VoxVer Launcher Release Workflow

on:
  push:
    tags:
      - 'VoxVer*'

env:
  NODE_VERSION: 24.x
  NPM_REGISTRY: https://registry.npmjs.org/

jobs:
  release:
    name: Build and Release VoxVer Launcher
    strategy:
      matrix:
        platform: [windows, macos]
        include:
          - platform: windows
            artifact-pattern: |
              build/VoxVer Launcher Setup *.exe
              build/*.blockmap
              build/latest.yml
            build-script: build:win
          - platform: macos
            artifact-pattern: |
              build/*.dmg
              build/*.blockmap
              build/latest-mac.yml
            build-script: build:mac
    runs-on: ${{ matrix.platform }}-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: ${{ env.NPM_REGISTRY }}

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Lint code
        run: npm run lint
        continue-on-error: false

      - name: Build TypeScript
        run: npm run build
        continue-on-error: false

      - name: Build & Package
        run: npm run ${{ matrix.build-script }}
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact-pattern }}
          tag_name: ${{ github.ref_name }}
          name: VoxVer Launcher v0.6.3
          body: |
            ## VoxVer Launcher v0.6.3 发布

            **版本类型**: 启动器设置重构 + 更新弹窗 + 审查修复

            **主要变更**:
            - 启动器设置独立分类（更新通道 + 自动检查）
            - 更新通道稳定版/测试版分段芯片
            - 自动检查开启/关闭左右双芯片
            - 更新弹窗重构（Markdown 渲染 + 下载即时反馈）
            - i18n 中英文完全对齐
            - updater 错误清除 + 内存泄漏修复
            - 支持 Windows + macOS 双平台

            **技术栈**: Electron 33.4.11 + Vue 3.5 + TypeScript 5.5

          draft: false
          prerelease: false

      - name: Cleanup
        run: |
          echo "Release workflow completed successfully"
          echo "Version: 0.6.3"
          echo "Platform: ${{ matrix.platform }}"
          echo "Tag: ${{ github.ref_name }}"