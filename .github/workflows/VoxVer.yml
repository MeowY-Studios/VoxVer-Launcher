name: VoxVer Launcher Release Workflow

# 打 tag（形如 VoxVer-v0.7.6）时构建 Windows / macOS 安装包并发布到 GitHub Releases。
on:
  push:
    tags:
      - 'VoxVer*'

env:
  NODE_VERSION: 24.x
  NPM_REGISTRY: https://registry.npmjs.org/

jobs:
  release:
    name: Build and Release
    # 目前只出 Windows 包：macOS 腿在 CI 上跑 electron-vite build 会报
    # ModManager.vue 模板表达式解析失败（本地 Windows 构建正常，待查），
    # 修好后再把 macos 加回 matrix。
    strategy:
      matrix:
        platform: [windows]
        include:
          - platform: windows
            artifact-pattern: |
              build/VoxVer-Launcher-Setup-*.exe
              build/*.blockmap
              build/latest.yml
            build-script: build:win
    runs-on: ${{ matrix.platform }}-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: ${{ env.NPM_REGISTRY }}

      # 版本号、发布说明都从仓库读取，避免像之前那样把 v0.6.3 写死在 workflow 里
      - name: Read version
        id: ver
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release note: docs/releases/v$VERSION.md"

      - name: Verify release note exists
        shell: bash
        run: |
          NOTE="docs/releases/v${{ steps.ver.outputs.version }}.md"
          if [ ! -f "$NOTE" ]; then
            echo "::error::缺少发布说明 $NOTE，请先补上再打 tag"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Lint code
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npx vitest run

      - name: Build & Package
        run: npm run ${{ matrix.build-script }}
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact-pattern }}
          tag_name: ${{ github.ref_name }}
          name: VoxVer Launcher v${{ steps.ver.outputs.version }}
          body_path: docs/releases/v${{ steps.ver.outputs.version }}.md
          draft: false
          prerelease: false

      - name: Cleanup
        shell: bash
        run: |
          echo "Release workflow completed"
          echo "Version: ${{ steps.ver.outputs.version }}"
          echo "Platform: ${{ matrix.platform }}"
          echo "Tag: ${{ github.ref_name }}"
