name: Build macOS

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (default from package.json)'
        required: false
        type: string

env:
  NODE_VERSION: '24'

jobs:
  # ARM64 (Apple Silicon) — macos-latest = macOS 26 (as of 2026-07)
  # Node 24 default, npm 11, OpenSSL 3.x, Xcode 26.4.1
  build-macos-arm64:
    name: Build macOS ARM64 (macOS 26)
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules (macOS 26 / OpenSSL 3.x)
        run: npx electron-builder install-app-deps
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Build & Package (macOS ARM64)
        run: npm run build:mac:arm64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: List build output
        run: ls -la build/

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoxVer-Launcher-macOS-ARM64
          path: |
            build/*.dmg
            build/*.blockmap
            build/latest-mac.yml
          retention-days: 30

      - name: Upload to Release (if tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/*.dmg
            build/*.blockmap
            build/latest-mac.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # x64 (Intel) — macos-13 is the last Intel runner available
  # Note: macOS 13 runner may be deprecated in future; no Intel macOS 26 runner exists
  build-macos-x64:
    name: Build macOS x64 (macOS 13 Intel)
    runs-on: macos-13
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build & Package (macOS x64)
        run: npm run build:mac:x64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: List build output
        run: ls -la build/

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoxVer-Launcher-macOS-X64
          path: |
            build/*.dmg
            build/*.blockmap
            build/latest-mac.yml
          retention-days: 30

      - name: Upload to Release (if tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/*.dmg
            build/*.blockmap
            build/latest-mac.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
