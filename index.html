<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:;"
    />
    <title>MCLA</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; }
      body { background: #0D0D1A; overflow: hidden; }
      #splash-screen {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: linear-gradient(135deg, #0D0D1A 0%, #1A1A2E 50%, #0D0D1A 100%);
        z-index: 9999; transition: opacity 0.3s ease;
      }
      #splash-screen.hidden { opacity: 0; pointer-events: none; }
      .splash-logo {
        width: 80px; height: 80px; margin-bottom: 24px;
        border-radius: 16px; background: linear-gradient(135deg, #6366F1 0%, #8B5CF6 100%);
        display: flex; align-items: center; justify-content: center;
        animation: pulse 2s ease-in-out infinite;
      }
      .splash-logo svg { width: 48px; height: 48px; }
      .splash-title {
        font-family: 'Segoe UI', -apple-system, sans-serif;
        font-size: 24px; font-weight: 600; color: #FFFFFF;
        letter-spacing: 2px; margin-bottom: 8px;
      }
      .splash-version {
        font-family: 'Segoe UI', -apple-system, sans-serif;
        font-size: 12px; color: #8B8FA3; margin-bottom: 24px;
      }
      .splash-progress {
        width: 200px; height: 3px; background: rgba(255,255,255,0.1);
        border-radius: 2px; overflow: hidden;
      }
      .splash-progress-bar {
        width: 0%; height: 100%;
        background: linear-gradient(90deg, #6366F1, #8B5CF6);
        border-radius: 2px;
        animation: progress 2s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(99, 102, 241, 0.4); }
        50% { transform: scale(1.05); box-shadow: 0 0 30px 10px rgba(99, 102, 241, 0.2); }
      }
      @keyframes progress {
        0% { width: 0%; }
        50% { width: 70%; }
        100% { width: 100%; }
      }
    </style>
  </head>
  <body>
    <div id="splash-screen">
      <div class="splash-logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
          <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" />
          <polyline points="22 4 12 14.01 9 11.01" />
        </svg>
      </div>
      <div class="splash-title">MCLA</div>
      <div class="splash-version">v0.5.4</div>
      <div class="splash-progress">
        <div class="splash-progress-bar"></div>
      </div>
    </div>
    <div id="svg-sprite" style="display:none"></div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
    <script>
      (function() {
        var splash = document.getElementById('splash-screen');
        var hidden = false;
        function hideSplash() {
          if (hidden) return;
          hidden = true;
          if (splash) {
            splash.classList.add('hidden');
            setTimeout(function() { splash.remove(); }, 300);
          }
        }
        setTimeout(hideSplash, 5000);
        if (typeof window.addEventListener === 'function') {
          window.addEventListener('load', function() { setTimeout(hideSplash, 2000); });
        }
      })();
    </script>
  </body>
</html>
